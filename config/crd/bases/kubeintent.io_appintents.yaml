apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appintents.kubeintent.io
spec:
  group: kubeintent.io
  names:
    kind: AppIntent
    listKind: AppIntentList
    plural: appintents
    singular: appintent
    shortNames: [ai]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, policy]
              properties:
                targetRef:
                  type: object
                  required: [apiVersion, kind, name]
                  properties:
                    apiVersion: { type: string }
                    kind: { type: string }
                    name: { type: string }
                runtimeProfileRef:
                  type: string
                policy:
                  type: object
                  properties:
                    availability:
                      type: string
                      enum: [bronze, silver, gold]
                    latencyTargetMs:
                      type: integer
                      minimum: 1
                    maxMonthlyCostUSD:
                      type: number
                      minimum: 0
                    securityTier:
                      type: string
                      enum: [baseline, hardened, strict]
                    autoscaling:
                      type: object
                      properties:
                        enabled: { type: boolean }
                        minReplicas: { type: integer, minimum: 1 }
                        maxReplicas: { type: integer, minimum: 1 }
                        cpuUtilizationTargetPct:
                          type: integer
                          minimum: 1
                          maximum: 100
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedState:
                  type: object
                  properties:
                    lastObservedAt:
                      type: string
                      format: date-time
                    latency:
                      type: object
                      properties:
                        p99: { type: string }
                        p50: { type: string }
                    currentReplicas:
                      type: integer
                      format: int32
                    currentMonthlyCostUSD:
                      type: number
                    observedRPS:
                      type: number
                decisions:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      at:
                        type: string
                        format: date-time
                      action:
                        type: string
                        enum: [ScaleReplicas, NoOp, Blocked]
                      reason: { type: string }
                      fromValue: { type: string }
                      toValue: { type: string }
                      inputs:
                        type: object
                        additionalProperties:
                          type: string
                compliance:
                  type: object
                  properties:
                    overall:
                      type: string
                      enum: [Meeting, AtRisk, Violating, Unknown]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Compliance
          type: string
          jsonPath: .status.compliance.overall
        - name: P99
          type: string
          jsonPath: .status.observedState.latency.p99
        - name: Replicas
          type: integer
          jsonPath: .status.observedState.currentReplicas
        - name: Cost/Month
          type: string
          jsonPath: .status.observedState.currentMonthlyCostUSD
          description: Estimated monthly cost in USD
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
