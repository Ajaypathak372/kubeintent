# Demo workload: cpu-burner
# Burns CPU via sha256 loops on every request, generating real CPU load
# that triggers HPA scaling. Exposes http_request_duration_seconds histogram
# for the operator's PromQL queries. WORK_MS controls per-request CPU time.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: cpu-burner:demo
          env:
            - name: WORK_MS
              value: "10"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: kubeintent.io/v1alpha1
kind: AppIntent
metadata:
  name: demo-app
  namespace: default
  annotations:
    kubeintent.io/promql-p99: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="default",pod=~"demo-app.*"}[2m])) by (le))'
    kubeintent.io/promql-p50: 'histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace="default",pod=~"demo-app.*"}[2m])) by (le))'
    kubeintent.io/promql-rps: 'sum(rate(http_request_duration_seconds_count{namespace="default",pod=~"demo-app.*"}[1m]))'
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  policy:
    availability: silver
    latencyTargetMs: 100
    maxMonthlyCostUSD: 500
    securityTier: baseline
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      cpuUtilizationTargetPct: 50
