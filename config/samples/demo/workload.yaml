# Demo workload: stefanprodan/podinfo
# Emits http_request_duration_seconds histogram. Random delay is configured
# so that normal traffic stays under the latency target but high concurrency
# pushes p99 above the threshold, triggering the closed-loop react phase.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: ["./podinfo"]
          args:
            - "--port=9898"
            - "--random-delay=true"
            - "--random-delay-unit=ms"
            - "--random-delay-min=70"
            - "--random-delay-max=150"
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 9898
---
apiVersion: kubeintent.io/v1alpha1
kind: AppIntent
metadata:
  name: demo-app
  namespace: default
  annotations:
    kubeintent.io/promql-p99: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="default",pod=~"demo-app.*"}[2m])) by (le))'
    kubeintent.io/promql-p50: 'histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace="default",pod=~"demo-app.*"}[2m])) by (le))'
    kubeintent.io/promql-rps: 'sum(rate(http_request_duration_seconds_count{namespace="default",pod=~"demo-app.*"}[1m]))'
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  policy:
    availability: silver
    latencyTargetMs: 100
    maxMonthlyCostUSD: 500
    securityTier: baseline
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      cpuUtilizationTargetPct: 70
